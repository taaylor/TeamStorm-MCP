[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[project]
name = "teamstorm-mcp"
version = "0.3.0"
description = "TeamStorm integration for AI coding agents through MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ushakov Maksim, Kolesnikov Matvey" }]

dependencies = [
  "aiohttp>=3.14.3",
  "fastmcp==3.4.7",
  "langgraph>=1.2.11",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyyaml>=6.0.3",
]

[project.scripts]
teamstorm-mcp = "teamstorm_mcp.bootstrap:main"
teamstorm-daemon = "teamstorm_mcp.daemon:main"

[dependency-groups]
dev = [
  "aioresponses>=0.7.9",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.7",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: read-only tests against a real TeamStorm instance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
