name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.23'
          python-version: '3.12'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must match pyproject.toml: v{version}")
          PY
      - name: Lint and type check
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy src
      - name: Test
        run: uv run --no-sync pytest -m 'not integration'
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify installed wheel
        run: |
          uv venv "$RUNNER_TEMP/install-check"
          uv pip install --python "$RUNNER_TEMP/install-check/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/install-check/bin/python" - <<'PY'
          from importlib.metadata import distribution

          package = distribution("teamstorm-mcp")
          scripts = {entry.name: entry for entry in package.entry_points if entry.group == "console_scripts"}
          for name in ("teamstorm-mcp", "teamstorm-daemon"):
              assert callable(scripts[name].load()), name
          print(f"Installed teamstorm-mcp {package.version}; both entry points load")
          PY
      - name: Prepare release files
        run: |
          cp .env.example dist/teamstorm.env.example
          cp README.md dist/README.md
          cd dist
          sha256sum *.whl *.tar.gz teamstorm.env.example README.md > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: teamstorm-mcp-dist
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: teamstorm-mcp-dist
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
